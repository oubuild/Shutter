[package]
name = "shutter"
version = "0.8.0"
description = "Shutter — macOS screenshot, annotation, pin, and vision-assistant tool"
authors = ["Oubuild"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "shutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "macos-system-configuration"] }
xcap = "0.9"
image = { version = "0.25", features = ["png", "jpeg"] }
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Launch-at-login for the settings popover's switch. The login item is the
# single source of truth — the toggle reads and writes it directly instead of
# mirroring a flag into settings.json.
tauri-plugin-autostart = "2"
# Named only for `Update::download_url` in updater.rs.
url = "2"
# Verify every downloaded model artifact before it can be installed.
sha2 = "0.10"
# Long-screenshot FFT-NCC displacement estimator (reference `fft_ncc`): column
# cross-correlation when the row-signature matcher's evidence is too weak.
# Pure Rust, no system dependencies.
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
# Scroll-capture event injection/tap: the same CoreGraphics APIs the reference
# app uses (CGEventCreateScrollWheelEvent2 + CGEventPost, CGEventTapCreate).
# Both crates are already in Cargo.lock via transitive deps, so the offline
# build needs no new downloads.
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }
core-foundation = "0.10"
# System OCR engine: VNRecognizeTextRequest from the Vision framework. Only
# the classes we call are enabled; the crate's default features would pull in
# AVFoundation/CoreML/etc. bindings we never touch.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSProcessInfo"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "alloc", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Local OCR (识图): the RapidOCR pipeline (det + rec) over ONNX Runtime for the
# two optional downloadable models. Apple Silicon only — ONNX Runtime ships
# no prebuilt binaries for x86_64-apple-darwin, and the picker gates the model
# cards to Apple Silicon (ocr::models::models_supported) everywhere else.
rapidocr-core = "0.2.2"
# rapidocr-core 0.2.2 is written against the rc.12 API (`Session::builder()`
# with no arguments); newer rc's changed that signature, so the whole graph
# must unify on exactly rc.12 (ONNX Runtime 1.24.2 via download-binaries).
ort = "=2.0.0-rc.12"

# The API key used to live in the OS credential store (`keyring`: Keychain /
# Credential Manager / Secret Service). The macOS Keychain proved unreliable,
# and consistency beats platform variance: the key now persists in
# settings.json like every other setting, so no platform needs a credential
# backend.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Automation hooks used by the test suite (capture-on-start, debug views).
# Never enable in a release build.
debug-hooks = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
