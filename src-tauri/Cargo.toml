[package]
name = "shutter"
version = "0.2.0"
description = "Shutter — macOS screenshot, annotation, pin, and vision-assistant tool"
authors = ["Oubuild"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "shutter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "macos-system-configuration"] }
xcap = "0.9"
image = { version = "0.25", features = ["png", "jpeg"] }
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2.8.3"

# The API key lives in the OS credential store. `keyring` picks its backend at
# compile time from these features, and the backend is per-platform, so each
# target enables exactly one. A platform without a backend silently falls back
# to keyring's in-memory mock, which would lose the key on every restart.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Scroll-capture event injection/tap: the same CoreGraphics APIs the reference
# app uses (CGEventCreateScrollWheelEvent2 + CGEventPost, CGEventTapCreate).
# Both crates are already in Cargo.lock via transitive deps, so the offline
# build needs no new downloads.
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Secret Service over D-Bus (GNOME Keyring / KWallet). `crypto-rust` keeps the
# session key exchange pure-Rust so the build needs no OpenSSL headers.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Automation hooks used by the test suite (capture-on-start, debug views).
# Never enable in a release build.
debug-hooks = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
