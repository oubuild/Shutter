name: build

# Three-platform desktop build: macOS (arm64 + x64), Windows x64, Linux x64.
#
# - Every push to main and every PR runs the full matrix, so a platform that
#   stops compiling is caught before release. Bundles are kept as workflow
#   artifacts only; nothing is ever uploaded to a release from a branch.
# - A release exists only when a `v*` tag is pushed by hand (`pnpm release`).
#   The tag creates a draft GitHub Release with a generated changelog
#   (changelogithub), the four builds attach their installers to it, and the
#   publish job flips it live only after the whole matrix is green.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight build. Tag builds are
# never cancelled: a half-uploaded release is worse than a slow one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri's CLI reads this to decide whether it may prompt.
  CI: true

jobs:
  # The release is created once, up front. If each matrix job let tauri-action
  # create it, four jobs would race: all four see "no release for this tag" and
  # all four create one, leaving duplicate drafts.
  release:
    name: Changelog and draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # changelogithub walks the commit history between tags.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # antfu's changelogithub turns conventional commits into release notes
      # and creates the release as a draft. The build matrix attaches the
      # installers to it, and the publish job flips it live once every
      # platform is green.
      - name: Create draft release with changelog
        run: npx --yes changelogithub@15 --draft --name "Shutter $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notes changelogithub cannot generate: which file is which platform,
      # and the ad-hoc-signing caveat for macOS users.
      - name: Append installer notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          cat >> notes.md <<'EOF'

          ## 安装包

          | 平台 | 文件 |
          | --- | --- |
          | macOS (Apple Silicon) | `Shutter_*_aarch64.dmg` |
          | macOS (Intel) | `Shutter_*_x64.dmg` |
          | Windows | `Shutter_*_x64-setup.exe`、`Shutter_*_x64_en-US.msi` |
          | Linux | `Shutter_*_amd64.deb`、`Shutter_*_amd64.AppImage` |

          macOS 构建为 ad-hoc 签名、未公证。首次打开请走
          系统设置 → 隐私与安全性 → 仍要打开。
          EOF
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Get release id
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    # Branch and PR builds have no release job; only run after it when it ran.
    if: always() && !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action uploads assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets are cross-compiled on the arm64 runner. Intel
          # macOS images only exist as paid larger runners, and Tauri supports
          # `--target x86_64-apple-darwin` from arm64 out of the box.
          - name: macOS arm64
            platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS x64
            platform: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            platform: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            # 24.04, not 22.04: libspa-sys runs bindgen against the system
            # PipeWire headers, and 22.04 ships 0.3.48. libspa 0.10 needs at
            # least 0.3.65 — 0.3.48 has neither `spa_meta_first` nor the
            # `flags` field on `spa_video_info_raw`, so the bindings fail to
            # compile. 24.04 ships 1.0.5, and also matches the glibc the .deb
            # is built against.
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node: the node cache key is derived
      # from `pnpm store path`, which does not exist yet otherwise.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per target: the four jobs build four different dependency
          # graphs, and a shared key would evict itself on every run.
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target
          # A red job normally discards its cache, which is exactly backwards:
          # a build that fails while compiling dependencies is the one that
          # downloaded the most crates. Keep it so the next attempt starts warm
          # instead of re-fetching the whole registry index and every crate.
          cache-on-failure: true

      # xcap needs the X11/Wayland capture stack, tauri needs webkit2gtk and
      # GTK, keyring needs D-Bus, and libspa-sys runs bindgen against the
      # PipeWire headers at build time.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libdrm-dev libgbm-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing. Apple Silicon refuses to run unsigned arm64
          # binaries, and an unsigned bundle also fails Gatekeeper less
          # gracefully. There is no Developer ID here, so this is the honest
          # maximum; it does not make the app notarized.
          APPLE_SIGNING_IDENTITY: "-"
          # Updater signing (tauri signer, passwordless key). The updater
          # artifacts (.tar.gz / setup.exe + .sig) and latest.json are only
          # produced when the private key is present; branch builds without
          # the secret simply skip them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Set only for tag builds. When empty, tauri-action skips release
          # uploads entirely and only produces workflow artifacts.
          releaseId: ${{ needs.release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # tauri-action merges each platform's signed-artifact entries into a
          # single latest.json on the release — the app's updater endpoint.
          uploadUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          uploadWorkflowArtifacts: true
          # Must be unique per artifact: a macOS job emits both a .app and a
          # .dmg, and a constant name would collide between the two.
          workflowArtifactNamePattern: "shutter-${{ matrix.target }}-[bundle]"

  # Publish — but only on a tag, and only when every platform uploaded its
  # installers. The release is already a draft with the changelog and assets;
  # this just flips it live. If any build failed, the draft stays a draft and
  # a human decides whether to retry or fix.
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && (needs.build.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$names"
          missing=0
          for pattern in aarch64.dmg x64.dmg x64-setup.exe x64_en-US.msi amd64.deb amd64.AppImage; do
            if ! grep -q "$pattern" <<<"$names"; then
              echo "::warning::installer matching '$pattern' is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Installers are incomplete; keeping the draft for a human to decide."
            exit 1
          fi
          # The updater's endpoint is latest.json on this release; publishing
          # without it would 404 every "check for updates" in the wild.
          if ! grep -q '^latest.json$' <<<"$names"; then
            echo "::error::latest.json is missing; the in-app updater would break."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "Released $GITHUB_REF_NAME."
