name: Sync CNB Mirror

# Mirrors the repository (all branches + tags) to CNB (cnb.cool) so mainland
# users can browse and clone without a GitHub connection. CNB is a read-mostly
# mirror here: development stays on GitHub, and nothing ever flows back.
#
# Mirrors reject concurrent forced updates to the same ref, so triggers are
# serialized; tag/delete events still sync immediately.
on:
  push:
    branches: [main]
    tags: ["v*"]
  delete:
  schedule:
    # Daily at 09:17 UTC+8, off the top of the hour to dodge the
    # scheduled-run rush. Pushes above still sync immediately.
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-cnb-mirror
  cancel-in-progress: false

jobs:
  sync-cnb:
    name: Push to CNB
    runs-on: ubuntu-latest
    # The mirror destination is fixed to the upstream remote; a fork must
    # never publish its refs there, even with mirrored secrets.
    if: github.repository == 'oubuild/Shutter'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/ryanuo/shutter.git"
          git push cnb --all --force
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push cnb ":refs/tags/${GITHUB_REF_NAME}" || true
          fi
          git push cnb --tags --force
