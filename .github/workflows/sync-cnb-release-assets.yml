name: Sync CNB Release Assets

# Copies one GitHub release (metadata + installer assets) to the CNB mirror so
# mainland users can download without a GitHub connection. Runs after a normal
# release: dispatch it with the tag once build.yml has published.
#
# Requires the CNB_TOKEN secret and the mirror repo to exist (see
# sync-cnb-release.mjs for the repository default).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync"
        required: true
        type: string

permissions:
  contents: read

env:
  CNB_REPOSITORY: "ryanuo/shutter"

jobs:
  sync-release-to-cnb:
    name: Sync release to CNB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download GitHub release assets
        env:
          TAG_NAME: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/github-release" "$RUNNER_TEMP/release-assets"
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,targetCommitish,isPrerelease,isDraft,assets \
            > "$RUNNER_TEMP/github-release/release.json"
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets" \
            --clobber

      - name: Sync release assets to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_UPLOAD_CONCURRENCY: "3"
        run: |
          node .github/scripts/sync-cnb-release.mjs \
            --github-release "$RUNNER_TEMP/github-release/release.json" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --make-latest

      # The mirror only needs the recent installers, not every historical
      # build; keep the newest 5 v-tags.
      - name: Prune old CNB releases
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          node .github/scripts/cleanup-cnb-releases.mjs \
            --current-tag "${{ inputs.tag }}" \
            --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            --retain 5 \
            --apply
